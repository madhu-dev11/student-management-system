<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org" lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Student</title>
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link href="https://fonts.googleapis.com/css2?family=Sora:wght@300;400;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div class="wrapper">

    <header class="header">
        <div class="header-inner">
            <div class="logo">
                <span class="logo-icon">🎓</span>
                <span class="logo-text">StudentMS</span>
            </div>
            <nav>
                <a href="/" class="nav-link">← Back to Dashboard</a>
            </nav>
        </div>
    </header>

    <main class="main">
        <div class="form-container">
            <h2 class="form-title">Edit Student Details</h2>

            <form th:action="@{/students/update/{id}(id=${student.id})}"
                  th:object="${student}" method="post" class="student-form">

                <div class="form-row">
                    <div class="form-group">
                        <label>First Name</label>
                        <input type="text" th:field="*{firstName}" required />
                    </div>
                    <div class="form-group">
                        <label>Last Name</label>
                        <input type="text" th:field="*{lastName}" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>Email</label>
                    <input type="email" th:field="*{email}" required />
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label>Department</label>
                        <select th:field="*{department}" required>
                            <option value="">-- Select Department --</option>
                            <option value="Computer Science">Computer Science</option>
                            <option value="Information Science">Information Science</option>
                            <option value="Electronics">Electronics</option>
                            <option value="Mechanical">Mechanical</option>
                            <option value="Civil">Civil</option>
                            <option value="MBA">MBA</option>
                        </select>
                    </div>
                    <div class="form-group">
                        <label>Age</label>
                        <input type="number" th:field="*{age}" min="16" max="40" required />
                    </div>
                </div>

                <div class="form-group">
                    <label>Phone Number</label>
                    <input type="tel" th:field="*{phone}" required />
                </div>

                <div class="form-actions">
                    <button type="submit" class="btn-primary">Update Student</button>
                    <a href="/" class="btn-secondary">Cancel</a>
                </div>

            </form>
        </div>
    </main>

</div>

<script th:src="@{/js/script.js}"></script>
</body>
</html>
